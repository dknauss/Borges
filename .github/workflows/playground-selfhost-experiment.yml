name: Playground Self-Host Experiment

# TEMPORARY (removed before #282 merges): does a self-built copy of WordPress
# Playground, served from this runner on localhost, boot the Borges demos more
# often than playground.wordpress.net? It builds Playground from source at a
# pinned commit, then probes both with scripts/playground-live-probe.mjs in
# Chromium, Firefox, and WebKit, alternating between them so both see the same
# network conditions, and writes one report comparing them.

on:
    push:
        branches:
            - claude/project-thread-4elbji
        paths:
            - .github/workflows/playground-selfhost-experiment.yml

permissions:
    contents: read

jobs:
    experiment:
        runs-on: ubuntu-24.04
        timeout-minutes: 240
        env:
            PLAYGROUND_SHA: af13c04ca16c765f6dc6b60f0915230eec3e4856
            RUNS: '5'
        steps:
            - name: Free disk space
              run: |
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
                  df -h /

            - uses: actions/checkout@v5

            - name: Check out Playground
              run: |
                  git init -q wp-playground
                  cd wp-playground
                  git remote add origin https://github.com/WordPress/wordpress-playground.git
                  git fetch -q --depth 1 origin "$PLAYGROUND_SHA"
                  git checkout -q FETCH_HEAD
                  git submodule update -q --init --recursive --depth 1

            - uses: actions/setup-node@v5
              with:
                  node-version-file: wp-playground/.nvmrc

            - name: Build Playground
              working-directory: wp-playground
              env:
                  NODE_OPTIONS: --max-old-space-size=12288
              run: |
                  npm install -g npm@11
                  npm ci
                  npm run build:website
                  site="$(dirname "$(find dist -name remote.html -path '*wasm-wordpress-net*' | head -1)")"
                  echo "Built site: $site"
                  du -sh "$site"
                  echo "SITE=$PWD/$site" >> "$GITHUB_ENV"

            - name: Serve it on localhost:8080
              run: |
                  cat > /tmp/serve.py <<'PY'
                  import http.server, os, sys
                  class Handler(http.server.SimpleHTTPRequestHandler):
                      extensions_map = {**http.server.SimpleHTTPRequestHandler.extensions_map,
                                        '.wasm': 'application/wasm', '.js': 'text/javascript',
                                        '.mjs': 'text/javascript'}
                      def log_message(self, *args):
                          pass
                  os.chdir(sys.argv[1])
                  http.server.ThreadingHTTPServer(('127.0.0.1', 8080), Handler).serve_forever()
                  PY
                  nohup python3 /tmp/serve.py "$SITE" > /tmp/serve.log 2>&1 &
                  sleep 2
                  curl -fsS -o /dev/null -w 'index %{http_code}\n' http://localhost:8080/
                  curl -fsS -o /dev/null -w 'remote %{http_code}\n' http://localhost:8080/remote.html

            - name: Set up Borges's Node.js and dependencies
              uses: ./.github/actions/setup-node-deps

            - name: Install browsers
              run: npx playwright install --with-deps chromium firefox webkit

            - name: Probe self-hosted and public Playground
              env:
                  CONTROL: https://raw.githubusercontent.com/dknauss/Borges/${{ github.sha }}/scripts/probe-fixtures/control-blueprint.json
                  MAIN: https://raw.githubusercontent.com/dknauss/Borges/main/playground/blueprint-main.json
              run: |
                  for browser in chromium firefox webkit; do
                      for target in http://localhost:8080/ https://playground.wordpress.net/; do
                          echo "::group::$browser on $target"
                          PROBE_BROWSER=$browser PROBE_RUNS=$RUNS PROBE_PLAYGROUND=$target \
                              PROBE_RESULTS=results.jsonl \
                              node scripts/playground-live-probe.mjs "$MAIN" || true
                          PROBE_BROWSER=$browser PROBE_RUNS=$RUNS PROBE_PLAYGROUND=$target \
                              PROBE_RESULTS=results.jsonl PROBE_ANY_BLOCK=1 \
                              node scripts/playground-live-probe.mjs "$CONTROL" || true
                          echo "::endgroup::"
                      done
                  done
                  node scripts/playground-probe-report.mjs results.jsonl | tee -a "$GITHUB_STEP_SUMMARY"

            - name: Upload results and screenshots
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: selfhost-experiment
                  path: |
                      results.jsonl
                      probe-*.png
                  if-no-files-found: ignore
