name: CI

on:
    push:
        branches:
            - main
            - master
            - 'codex/**'
    pull_request:

permissions:
    contents: read

# A newer push to the same pull request cancels the older run, whose result no
# longer matters. Every other run gets a group of its own (its run ID), so
# pushes to main are never cancelled or queued behind each other: each one
# still gets a full run, and the main preview job already skips a stale commit.
concurrency:
    group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

jobs:
    quality:
        name: Quality (Node 22)
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Node.js and dependencies
              uses: ./.github/actions/setup-node-deps

            - name: Verify docs/current-metrics.md
              run: bash .github/scripts/verify-metrics.sh docs/current-metrics.md

            - name: Lint JavaScript
              run: npm run lint:js

            - name: Lint CSS
              run: npm run lint:css

            - name: Lint i18n artifacts
              run: npm run lint:i18n

            - name: Check formatting
              run: npm run format:check

            - name: Type-check src/lib (JSDoc, checkJs)
              run: npm run typecheck:js

            - name: Audit production npm dependencies
              run: npm audit --omit=dev --omit=optional

            - name: Run unit tests
              run: npm test -- --runInBand --silent

            - name: Build
              run: npm run build

    phpunit:
        name: PHPUnit
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  coverage: none

            - name: Validate Composer files
              run: composer validate --strict

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist

            - name: Audit Composer production dependencies
              run: composer audit --no-dev

            - name: Run PHPCS
              run: composer lint:php

            - name: Run PHPUnit
              run: composer test:php

    # The three Playwright suites each boot their own Playground servers, so
    # they run as parallel jobs rather than one after another (smoke ~3m, a11y
    # ~1m, lifecycle ~2m in one job made it CI's critical path at ~7m45s). They
    # no longer wait for Quality either: they test the build, not the lint, and
    # the gate job below still holds the required check until both finish.
    playwright-suites:
        name: Playwright (${{ matrix.suite }})
        # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.59 cannot
        # install Chromium. Move back once Playwright supports it.
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                suite:
                    - playground
                    - a11y
                    - lifecycle

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Node.js and dependencies
              uses: ./.github/actions/setup-node-deps

            - name: Build
              run: npm run build

            # The test scripts run the Playground CLI through npx, which
            # downloads it (~570 MB unpacked) on every run, and Chromium comes
            # from the Playwright CDN. Keyed on the lockfile (Playwright's
            # version) and the scripts (the pinned CLI version), so a bump to
            # either misses and downloads fresh.
            - name: Restore Playwright browsers and Playground CLI
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/ms-playwright
                      ~/.npm/_npx
                  key: e2e-tools-ubuntu24-${{ hashFiles('package-lock.json', 'scripts/test-playground-e2e.sh', 'scripts/test-a11y.sh', 'scripts/test-lifecycle-e2e.sh') }}

            # The Playground CLI keeps each WordPress release ZIP it downloads
            # in ~/.wordpress-playground/ and reuses it when the version
            # matches. Only the ZIPs are cached, never sites/. A stale ZIP is
            # harmless: when "latest" moves on, the CLI downloads the new one,
            # and the weekly key saves it.
            - name: Compute weekly cache key
              id: week
              run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

            - name: Restore WordPress release ZIPs
              uses: actions/cache@v4
              with:
                  path: ~/.wordpress-playground/*.zip
                  key: playground-wp-${{ steps.week.outputs.week }}
                  restore-keys: playground-wp-

            # This is the step that actually hung in #79 — apt-get, inside the
            # browser install — so it gets its own bound under the job timeout.
            #
            # Not about the artifact upload below: a cancelled job still
            # re-evaluates `if` conditions and `always()` evaluates true when
            # cancelled, so that upload runs either way. Verified in #79's own
            # cancelled run, where it completed successfully.
            #
            # What this actually buys, strongest first:
            #   1. Attributable. The log names the step that timed out, rather
            #      than a generic job-level annotation.
            #   2. Failed, not Cancelled — a cleaner signal for a required check.
            #   3. Fail fast, the weakest: it saves ~7 minutes of the job budget.
            #      (Not 8. The step starts ~42s into the job, so a 12-minute step
            #      bound fires at ~12.7 minutes on the job clock.)
            #
            # Sized against all 388 runs in which this step succeeded, not a
            # recent window — a short window misses the tail and misled earlier
            # attempts at this comment. The step is typically ~25s (median 25s,
            # p95 34s) but has reached 350s, with the step at >=50s in 2.1% of
            # them. 8 minutes would have been only 1.37x that worst case; 12 is
            # ~2.06x, and also exceeds the job's worst-ever GREEN wall time
            # (525s), so it can only fire on a true hang and never on a
            # legitimately slow run.
            #
            # Unfiltered, five job attempts have exceeded that 525s, and only in
            # ways this either catches or should not touch: the two ~6h hangs
            # (both in this step, both catchable), and three of one run's five
            # failing attempts at 629-915s, whose install step took 19-25s and
            # which this bound would not have fired on.
            - name: Install Playwright browsers
              timeout-minutes: 12
              run: npx playwright install --with-deps chromium

            - name: Run Playground Playwright smoke
              if: matrix.suite == 'playground'
              run: npm run test:e2e:playground

            - name: Run accessibility gate
              if: matrix.suite == 'a11y'
              run: npm run test:a11y

            # Builds Storybook, then loads every story in Chromium and fails
            # on a render error or an axe violation (scripts/storybook-a11y.mjs).
            - name: Check Storybook stories
              if: matrix.suite == 'a11y'
              run: npm run test:storybook

            - name: Package release zip (for lifecycle tests)
              if: matrix.suite == 'lifecycle'
              run: npm run package:release

            - name: Run lifecycle e2e tests
              if: matrix.suite == 'lifecycle'
              run: npm run test:e2e:lifecycle

            - name: Upload Playwright results
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: playwright-results-${{ matrix.suite }}
                  path: |
                      test-results
                      .tmp/playground-e2e
                  if-no-files-found: warn

    # Keeps the "Playwright Playground smoke" check name that branch protection
    # and the main preview depend on, and passes only when every suite passed
    # (a skipped or cancelled suite fails it, too).
    playwright-playground:
        name: Playwright Playground smoke
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: always()
        needs: playwright-suites

        steps:
            - name: Require every Playwright suite to pass
              env:
                  RESULT: ${{ needs.playwright-suites.result }}
              run: |
                  if [ "$RESULT" != "success" ]; then
                      echo "::error::Playwright suites finished with result: ${RESULT}"
                      exit 1
                  fi

    psalm:
        name: Psalm
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: phpunit

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  coverage: none

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist

            - name: Run Psalm
              run: composer analyze:php

    coverage:
        name: Coverage upload
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs:
            - quality
            - phpunit
        continue-on-error: true
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Node.js and dependencies
              uses: ./.github/actions/setup-node-deps

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  coverage: xdebug

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist

            - name: Generate JS coverage
              run: npm run test:js:coverage

            - name: Generate PHP coverage
              run: composer test:php:coverage

            - name: Upload to Codecov
              uses: codecov/codecov-action@v5
              with:
                  files: ./coverage/clover.xml,./build/logs/phpunit-clover.xml
                  slug: dknauss/Borges
                  use_oidc: true
                  fail_ci_if_error: false

    package-release:
        name: Package release artifact
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs:
            - quality
            - phpunit

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Node.js and dependencies
              uses: ./.github/actions/setup-node-deps

            - name: Build
              run: npm run build

            - name: Package plugin
              run: npm run package:release

            - name: Upload packaged plugin artifact
              uses: actions/upload-artifact@v6
              with:
                  name: bibliography-release
                  path: output/release/borges-bibliography-builder.zip
                  if-no-files-found: error

    # Publish the packaged main build to a rolling `main-preview` pre-release so
    # WordPress Playground has a stable, CORS-reachable URL for the current main
    # HEAD (git:directory is unavailable in live Playground). Isolated in its own
    # job so the write-scoped token is never present during checkout/build/package
    # (and never on pull_request or codex/** runs), gated behind the full required
    # CI suite so the Main-build badge can't install a build from a run that later
    # failed, and reuses the exact artifact those gates validated.
    publish-main-preview:
        name: Publish rolling main preview
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs:
            - quality
            - phpunit
            - playwright-playground
            - psalm
            - package-release
        permissions:
            contents: write
        # `published` is 'true' only when this run uploaded the ZIP (it was
        # still main's tip). publish-main-preview-pages runs only then, so a
        # stale run never reaches the Pages concurrency group below.
        outputs:
            published: ${{ steps.publish.outputs.published }}

        steps:
            - name: Download packaged plugin artifact
              uses: actions/download-artifact@v6
              with:
                  name: bibliography-release
                  path: output/release

            # Guard against a slower older run overwriting `main-preview` with a
            # stale ZIP. The tip re-check and the asset write live in ONE step so
            # the check happens immediately before the upload (minimal TOCTOU
            # window): if `main` has advanced past this commit, skip — the newer
            # run publishes. Correct regardless of job-scheduling order, unlike
            # job-level concurrency (which can cancel the newer run instead).
            - name: Publish rolling main preview
              id: publish
              # This job has no checkout, so gh cannot infer the repo from a local
              # git remote; GH_REPO gives `gh release`/`gh api` their repo context.
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  tip="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
                  if [ "$tip" != "${{ github.sha }}" ]; then
                      echo "::notice::main advanced to ${tip}; skipping stale main-preview publish for ${{ github.sha }}"
                      exit 0
                  fi
                  if ! gh release view main-preview >/dev/null 2>&1; then
                      gh release create main-preview \
                          --prerelease \
                          --title "Main branch preview (rolling)" \
                          --notes "Automated rolling build of the \`main\` branch, refreshed on every push. This is **not** a stable release — for production use install the latest tagged release or the WordPress.org listing."
                  fi
                  gh release upload main-preview output/release/borges-bibliography-builder.zip --clobber
                  echo "published=true" >> "$GITHUB_OUTPUT"

    # Also serve the same main-preview ZIP from GitHub Pages, at
    # https://dknauss.github.io/Borges/main-preview/borges-bibliography-builder.zip.
    # Pages answers with `Access-Control-Allow-Origin: *`, so the Main build
    # and write-API Playground blueprints fetch it directly instead of through
    # Playground's CORS proxy, which sometimes stalls and makes the demo fail
    # with "Could not download" (GitHub's release downloads send no CORS
    # header, which is why the proxy was needed). The release asset above stays
    # as the fallback; docs/playground-main-preview-hosting.md compares the two.
    #
    # Needs Settings -> Pages -> Source: "GitHub Actions". Runs only when
    # publish-main-preview uploaded this commit's ZIP, with the Pages
    # permissions only in this job.
    #
    # Staleness is checked before the job starts, not in a step: GitHub's
    # concurrency keeps one pending job per group and cancels the one already
    # pending when another arrives, even with cancel-in-progress: false. If a
    # stale run could enter the group, it would cancel the newest run's pending
    # deployment and then skip its own, leaving Pages on an older build. The
    # step-level check stays for a run that becomes stale while it waits.
    publish-main-preview-pages:
        name: Publish main preview to GitHub Pages
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish-main-preview.outputs.published == 'true'
        needs:
            - publish-main-preview
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}main-preview/borges-bibliography-builder.zip
        # One Pages deployment at a time; never cancel one that has started.
        concurrency:
            group: github-pages
            cancel-in-progress: false

        steps:
            - name: Check that this commit is still main's tip
              id: tip
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  tip="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
                  if [ "$tip" != "${{ github.sha }}" ]; then
                      echo "::notice::main advanced to ${tip}; skipping stale Pages publish for ${{ github.sha }}"
                      echo "current=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "current=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Download packaged plugin artifact
              if: steps.tip.outputs.current == 'true'
              uses: actions/download-artifact@v6
              with:
                  name: bibliography-release
                  path: site/main-preview

            # A plain index page, so the site root explains itself instead of
            # answering 404. The commit is recorded beside the ZIP.
            - name: Add an index page and the build's commit
              if: steps.tip.outputs.current == 'true'
              run: |
                  echo "${{ github.sha }}" > site/main-preview/COMMIT
                  cat > site/index.html <<'HTML'
                  <!doctype html>
                  <html lang="en">
                  <meta charset="utf-8">
                  <title>Borges main preview</title>
                  <p>This site serves the rolling build of the <code>main</code> branch of
                  <a href="https://github.com/dknauss/Borges">Borges Bibliography Builder</a>
                  for its WordPress Playground demo:
                  <a href="main-preview/borges-bibliography-builder.zip">main-preview/borges-bibliography-builder.zip</a>.
                  It is not a stable release.</p>
                  </html>
                  HTML

            - name: Upload the Pages site
              if: steps.tip.outputs.current == 'true'
              uses: actions/upload-pages-artifact@v4
              with:
                  path: site

            - name: Deploy to GitHub Pages
              id: deploy
              if: steps.tip.outputs.current == 'true'
              uses: actions/deploy-pages@v4
