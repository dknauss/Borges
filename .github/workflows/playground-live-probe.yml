name: Playground Live Probe

# Opens the README's Playground demo links on playground.wordpress.net in a
# fresh browser profile, in Chromium, Firefox, and WebKit, and reports whether
# each load reaches a working block editor or shows Playground's "Try again"
# screen, with the blueprint's network requests and console errors. A control
# blueprint without Borges runs in Chromium beside them, so a failure in both
# points at Playground rather than at Borges.
#
# Manual only: it depends on live third-party hosts. Use it when a demo link
# misbehaves (see scripts/playground-live-probe.mjs). demo-links.yml is the
# cheap weekly check that the install URLs still resolve.

on:
    workflow_dispatch:
        inputs:
            runs:
                description: Fresh-profile loads per blueprint
                default: '5'

permissions:
    contents: read

jobs:
    probe:
        name: Probe (${{ matrix.browser }})
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                browser: [chromium, firefox, webkit]
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v5

            - name: Set up Node.js and dependencies
              uses: ./.github/actions/setup-node-deps

            - name: Install the browser
              run: npx playwright install --with-deps ${{ matrix.browser }}

            - name: Probe the demo links
              env:
                  PROBE_BROWSER: ${{ matrix.browser }}
                  PROBE_RUNS: ${{ github.event.inputs.runs || '5' }}
              run: node scripts/playground-live-probe.mjs

            - name: Probe a control blueprint (no plugins)
              if: always() && matrix.browser == 'chromium'
              env:
                  PROBE_BROWSER: chromium
                  PROBE_RUNS: ${{ github.event.inputs.runs || '5' }}
                  PROBE_ANY_BLOCK: '1'
              run: node scripts/playground-live-probe.mjs "https://raw.githubusercontent.com/dknauss/Borges/${{ github.sha }}/scripts/probe-fixtures/control-blueprint.json"

            - name: Upload screenshots
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playground-probe-${{ matrix.browser }}
                  path: probe-*.png
                  if-no-files-found: ignore
