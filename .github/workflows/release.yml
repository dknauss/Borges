name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write
    actions: write

jobs:
    release:
        name: Build and publish release
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Build
              run: npm run build

            - name: Package release zip
              run: npm run package:release

            # The release body is this version's CHANGELOG section, followed by
            # GitHub's generated pull-request list (the action prepends the body
            # to the generated notes). Fails if CHANGELOG.md has no entry for
            # the tag, before anything is published.
            - name: Extract release notes from CHANGELOG
              run: node scripts/extract-changelog-section.js "$GITHUB_REF_NAME" > output/release/release-notes.md

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  files: output/release/borges-bibliography-builder.zip
                  body_path: output/release/release-notes.md
                  generate_release_notes: true
                  fail_on_unmatched_files: true
                  overwrite_files: true

            - name: Dispatch WordPress.org deploy
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run wp-deploy.yml --ref "$GITHUB_REF_NAME"
